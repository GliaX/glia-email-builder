[project]
name = "glia_email_builder"
authors = [
    { name = "Glia", email = "info@glia.org" }
]
description = "Block-based WYSIWYG email template builder for donor communications"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"

[project.urls]
Repository = "https://github.com/GliaX/glia-email-builder"
